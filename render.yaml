services:
  - type: web
    name: feishu-ai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
